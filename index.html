<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rette e parabole">
<title>Rette e parabole — Visualizer</title>
<style>

:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#19263b;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:24px 14px}h1{font-size:clamp(25px,3vw,34px);margin:3px 0 14px;letter-spacing:-.5px}p{color:#5e718f;margin:0 0 16px;font-size:17px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;background:white;border:1px solid #cbd8ee;color:#20395f;border-radius:10px;padding:10px 15px;min-height:42px}button.active,button.primary{background:#285bdb;border-color:#285bdb;color:#fff}button:focus-visible,input:focus-visible{outline:2px solid #285bdb;outline-offset:2px}.tabs{margin-bottom:12px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(315px,1fr);gap:14px}.card{background:#fff;border:1px solid #d9e4f3;border-radius:16px;padding:15px;min-width:0}.plot-wrap{position:relative;width:100%;aspect-ratio:720/540}canvas{display:block;width:100%;height:100%;touch-action:none;border-radius:6px}.actions{margin:12px 0}.hint{font-size:14px;color:#5a7090;margin-top:10px}.equation{text-align:center;font-weight:750;font-size:24px;margin:8px 0 20px;min-height:30px}.control{margin:17px 0 23px}.control-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:650;font-size:14px}.control input[type=number]{width:90px;padding:7px;font:inherit;font-size:16px;border:1px solid #ccd8eb;border-radius:8px;background:#fff;color:#15243f}.control input[type=range]{display:block;margin-top:17px;width:100%;accent-color:#285bdb;touch-action:pan-y}.checks{margin:20px 0 12px;display:grid;gap:14px;font-size:14px}.checks input{accent-color:#285bdb}.facts{padding:13px;background:#f2f5fc;border-radius:13px;font-size:14px;line-height:2;margin-top:15px}.facts strong{font-weight:700}.action-panel{margin-top:12px}button:active{transform:translateY(1px)}@media(max-width:770px){main{padding:14px 10px}.layout{grid-template-columns:1fr}h1{margin-top:8px}.card{padding:10px}p{font-size:15px}}

/* Nuova schermata: studio di funzione */
#studyLayout[hidden],#classicLayout[hidden]{display:none!important}
.study-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.study-top label{font-weight:700}.study-input{flex:1;min-width:220px;border:1px solid #cbd8ee;border-radius:10px;padding:12px 14px;font-size:20px;color:#17243c}
.study-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(315px,1fr);gap:14px}
.study-plot{position:relative;aspect-ratio:720/540;width:100%}
.study-plot canvas{width:100%;height:100%;display:block;touch-action:none}
.study-error{color:#b42318;font-size:14px;min-height:20px;margin:7px 0}
.study-legend{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0 5px;font-size:14px}
.study-legend label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.study-legend input{accent-color:#285bdb}
.swatch{width:13px;height:13px;border-radius:50%;display:inline-block}
.study-formula{font-size:15px;line-height:1.6;overflow-wrap:anywhere;padding:10px 0;border-bottom:1px solid #e4eafa}
.study-formula strong{color:#1d2a43}
.study-facts{background:#f2f5fc;border-radius:12px;padding:12px;font-size:14px;line-height:1.8;margin-top:12px}
.study-facts h3{margin:0 0 5px;font-size:15px}
.study-help{font-size:13px;color:#667996;line-height:1.6}
.study-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.study-actions button{font-size:14px}
.study-badge{display:inline-block;background:#eaf0ff;color:#2453b8;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:650}
@media(max-width:770px){.study-grid{grid-template-columns:1fr}.study-input{font-size:18px}}

  
/* VISUALIZER — INTERFACCIA MINIMAL */

:root {
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  color: #17243c;
  background: #f5f7fb;
}

body {
  background: #f5f7fb;
}

main {
  max-width: 1440px;
  margin: auto;
  padding: 28px 30px;
}

/* Titoli */
h1 {
  font-size: 30px;
  font-weight: 750;
  letter-spacing: -1px;
  margin: 0 0 24px;
}

/* Nasconde istruzioni e testi superflui */
main > p,
.hint,
.study-help,
.study-badge {
  display: none !important;
}

/* Navigazione */
.tabs {
  display: inline-flex;
  gap: 5px;
  padding: 5px;
  margin-bottom: 22px;
  background: #e9eef6;
  border-radius: 14px;
}

.tabs button {
  border: none;
  background: transparent;
  border-radius: 10px;
  padding: 11px 20px;
  font-weight: 600;
  color: #64748b;
  transition: background .2s, color .2s;
}

.tabs button.active {
  color: #ffffff;
  background: #2459de;
  box-shadow: 0 3px 8px #2459de25;
}

/* Pannelli */
.card {
  background: white;
  border: 1px solid #e5eaf2;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 4px 24px #15274407;
}

.layout,
.study-grid {
  grid-template-columns: minmax(0, 1.75fr)
                         minmax(300px, 1fr);
  gap: 18px;
}

/* Grafici */
.plot-wrap,
.study-plot {
  background: white;
  border-radius: 12px;
  overflow: hidden;
}

/* Pulsanti */
button {
  border: 1px solid #dce4f0;
  border-radius: 11px;
  padding: 10px 16px;
  min-height: 44px;
  font-weight: 550;
  background: #fff;
  color: #263a5a;
  transition: background .2s, box-shadow .2s;
}

button:hover {
  background: #f2f5ff;
}

button.active,
button.primary {
  color: #fff;
  background: #2459de;
  border-color: #2459de;
}

/* Formule */
.equation {
  font-size: 27px;
  letter-spacing: -.5px;
  margin-bottom: 24px;
}

.study-formula {
  font-size: 16px;
  line-height: 1.8;
  padding: 15px 0;
  border-bottom: 1px solid #edf0f5;
}

/* Controlli */
.control {
  margin: 18px 0 28px;
}

.control-head {
  font-size: 15px;
}

input[type="range"] {
  accent-color: #2459de;
}

.control input[type="number"],
.study-input {
  border: 1px solid #dce4f0;
  border-radius: 11px;
  background: #fafbfe;
}

/* Risultati matematici */
.facts,
.study-facts {
  background: #f5f7fc;
  border: 1px solid #edf0f7;
  border-radius: 14px;
  padding: 18px;
  font-size: 14px;
  line-height: 2;
}

.study-legend {
  padding: 12px 0;
  gap: 16px;
  font-weight: 550;
}

/* iPad e schermi piccoli */
@media (max-width: 900px) {
  main {
    padding: 18px 12px;
  }

  .layout,
  .study-grid {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 14px;
  }

  h1 {
    font-size: 26px;
  }

  .tabs {
    display: flex;
    width: 100%;
  }

  .tabs button {
    flex: 1;
    padding: 10px 7px;
    font-size: 13px;
  }
}


/* Le due pagine sono indipendenti; migliorie comuni per iPad */
html{-webkit-text-size-adjust:100%}
main{width:100%;max-width:1440px}
canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>
</head>
<body>
<main>
<h1>Rette e parabole</h1>
<div class="tabs" role="tablist" aria-label="Tipo di grafico"><button id="lineTab" type="button">Retta</button><button id="quadTab" type="button" class="active">Parabola</button></div>
<div class="layout" id="classicLayout"><section class="card"><div class="plot-wrap"><canvas id="plot" width="720" height="540" aria-label="Grafico interattivo"></canvas></div><div class="actions"><button id="zoomIn">+ Zoom</button><button id="zoomOut">− Zoom</button><button id="recenter">Centra</button></div><div class="hint">Trascina il grafico con il dito o la penna per spostare gli assi.</div></section>
<section class="card"><div class="equation" id="equation"></div><div id="controls"></div><div class="checks"><label><input id="notable" type="checkbox" checked> Mostra punti notevoli</label><label><input id="showSaved" type="checkbox"> Mostra curva memorizzata</label></div><div class="actions action-panel"><button id="remember" class="primary">Memorizza per confronto</button><button id="restore">Ripristina</button></div><div class="facts" id="facts" aria-live="polite"></div></section></div>
</main>
<script>
(function(){'use strict';
const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id), W=720,H=540;
let mode='quad',unit=54,centerX=312,centerY=224;
const defaults={line:{m:1,q:0},quad:{a:1,b:-2,c:-3}};
const current={line:{...defaults.line},quad:{...defaults.quad}};
const stored={line:null,quad:null};
const schema={line:[['m','Pendenza m',-8,8],['q','Intercetta q',-10,10]],quad:[['a','Coefficiente a',-5,5],['b','Coefficiente b',-10,10],['c','Coefficiente c',-10,10]]};
const round=n=>Math.abs(n)<1e-8?0:Math.round(n*100)/100;
const fmt=n=>String(round(n)).replace('.',',');
const value=(x,v)=>mode==='line'?v.m*x+v.q:v.a*x*x+v.b*x+v.c;
function formula(v){if(mode==='line')return 'y = '+fmt(v.m)+'x '+(v.q<0?'− ':'+ ')+fmt(Math.abs(v.q));return 'y = '+fmt(v.a)+'x² '+(v.b<0?'− ':'+ ')+fmt(Math.abs(v.b))+'x '+(v.c<0?'− ':'+ ')+fmt(Math.abs(v.c));}
function controls(){const holder=$('controls');holder.innerHTML='';for(const [key,title,min,max] of schema[mode]){const section=document.createElement('div');section.className='control';const header=document.createElement('div');header.className='control-head';const name=document.createElement('label');name.textContent=title;const num=document.createElement('input');num.type='number';num.step='0.1';num.value=current[mode][key];name.htmlFor='num-'+key;num.id='num-'+key;const slide=document.createElement('input');slide.type='range';slide.min=min;slide.max=max;slide.step='0.1';slide.value=current[mode][key];slide.setAttribute('aria-label',title);header.append(name,num);section.append(header,slide);holder.append(section);slide.addEventListener('input',()=>{current[mode][key]=Number(slide.value);num.value=slide.value;render()});num.addEventListener('input',()=>{const v=Number(num.value);if(num.value.trim()!==''&&Number.isFinite(v)){current[mode][key]=v;slide.value=Math.min(max,Math.max(min,v));render()}})}}
function seg(x1,y1,x2,y2,color='#e8eef8',width=1,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}
function xy(x,y){return [centerX+x*unit,centerY-y*unit]}
function text(t,x,y,size=14,color='#71829c',align='left'){ctx.font=size+'px -apple-system,Arial,sans-serif';ctx.textAlign=align;ctx.fillStyle=color;ctx.fillText(t,x,y)}
function point(x,y,label,priority=1){if(!Number.isFinite(x)||!Number.isFinite(y))return;const [px,py]=xy(x,y);if(px<8||px>W-8||py<8||py>H-8)return;const old=markers.find(m=>Math.hypot(m.px-px,m.py-py)<9);if(old){if(priority>old.priority)Object.assign(old,{label,priority});return}markers.push({px,py,label,priority})}
let markers=[];
function labels(){const used=[];markers.sort((a,b)=>b.priority-a.priority);for(const m of markers){ctx.font='bold 15px -apple-system,Arial';const width=ctx.measureText(m.label).width+20,hh=29;const positions=[[12,-37],[12,12],[-width-12,-37],[-width-12,12],[12,-65],[-width-12,40]];let best=null,score=Infinity;for(const [dx,dy] of positions){const x=m.px+dx,y=m.py+dy;const over=Math.max(0,5-x)+Math.max(0,x+width-W+5)+Math.max(0,5-y)+Math.max(0,y+hh-H+5);let overlap=0;for(const b of used)overlap+=Math.max(0,Math.min(x+width,b.x+b.w)-Math.max(x,b.x))*Math.max(0,Math.min(y+hh,b.y+b.h)-Math.max(y,b.y));const s=1000*over+overlap;if(s<score){score=s;best={x,y,w:width,h:hh}}}if(!best)continue;const x=Math.max(4,Math.min(W-best.w-4,best.x)),y=Math.max(4,Math.min(H-best.h-4,best.y));used.push({x,y,w:best.w,h:hh});ctx.fillStyle='#fff';ctx.strokeStyle='#cad8ee';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,best.w,hh,7);ctx.fill();ctx.stroke();text(m.label,x+10,y+19,15,'#285bdb');ctx.beginPath();ctx.arc(m.px,m.py,5,0,2*Math.PI);ctx.fillStyle='#285bdb';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}
function curve(v,color,dashed=false){ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();ctx.beginPath();ctx.setLineDash(dashed?[9,7]:[]);ctx.lineWidth=dashed?2.4:3.5;ctx.strokeStyle=color;let began=false;for(let px=0;px<=W;px+=1.5){const x=(px-centerX)/unit,py=centerY-value(x,v)*unit;if(!Number.isFinite(py)||Math.abs(py)>50000){began=false;continue}if(began)ctx.lineTo(px,py);else{ctx.moveTo(px,py);began=true}}ctx.stroke();ctx.restore()}
function axis(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);let step=unit;let interval=1;while(step<37){interval*=2;step=unit*interval}while(step>105){interval/=2;step=unit*interval}for(let k=Math.ceil(-centerX/step);k<=(W-centerX)/step;k++){const x=centerX+k*step;seg(x,0,x,H);if(Math.abs(x-centerX)>1)text(fmt(k*interval),x+4,centerY+16,14)}for(let k=Math.ceil((centerY-H)/step);k<=(centerY/step);k++){const y=centerY-k*step;seg(0,y,W,y);if(Math.abs(y-centerY)>1)text(fmt(k*interval),centerX+6,y-6,14)}seg(centerX,0,centerX,H,'#8493a9',1.5);seg(0,centerY,W,centerY,'#8493a9',1.5);text('x',W-18,centerY-9,14,'#52627e');text('y',centerX+9,18,14,'#52627e')}
function facts(v){if(mode==='line'){let html='<strong>Pendenza:</strong> '+fmt(v.m)+'<br><strong>Intersezione con asse y:</strong> (0; '+fmt(v.q)+')';if(v.m!==0)html+='<br><strong>Intersezione con asse x:</strong> ('+fmt(-v.q/v.m)+'; 0)';else html+='<br><strong>Retta:</strong> '+(v.q===0?'coincidente con asse x':'orizzontale');$('facts').innerHTML=html;return}const {a,b,c}=v;if(Math.abs(a)<1e-10){$('facts').innerHTML='<strong>Attenzione:</strong> a = 0: il grafico è una retta.<br><strong>Intercetta y:</strong> '+fmt(c);return}const h=-b/(2*a),k=value(h,v),disc=b*b-4*a*c;let html='<strong>Concavità:</strong> verso '+(a>0?'l’alto':'il basso')+'<br><strong>Vertice:</strong> V('+fmt(h)+'; '+fmt(k)+')<br><strong>Asse di simmetria:</strong> x = '+fmt(h)+'<br><strong>Discriminante:</strong> Δ = '+fmt(disc);if(disc>1e-10){const r1=(-b-Math.sqrt(disc))/(2*a),r2=(-b+Math.sqrt(disc))/(2*a);html+='<br><strong>Due radici reali:</strong> '+fmt(Math.min(r1,r2))+' e '+fmt(Math.max(r1,r2))}else if(Math.abs(disc)<=1e-10){html+='<br><strong>Una radice doppia:</strong> '+fmt(h)}else html+='<br><strong>Nessuna radice reale</strong>';$('facts').innerHTML=html}
function render(){markers=[];axis();if(stored[mode]&&$('showSaved').checked)curve(stored[mode],'#f0a345',true);const v=current[mode];curve(v,'#255ee1');$('equation').textContent=formula(v);facts(v);if($('notable').checked){if(mode==='line'){point(0,v.q,'(0; '+fmt(v.q)+')');if(Math.abs(v.m)>1e-10)point(-v.q/v.m,0,'x = '+fmt(-v.q/v.m),2)}else if(Math.abs(v.a)>1e-10){const h=-v.b/(2*v.a);point(h,value(h,v),'V('+fmt(h)+'; '+fmt(value(h,v))+')',3);point(0,v.c,'(0; '+fmt(v.c)+')');const d=v.b*v.b-4*v.a*v.c;if(d>=0){const r1=(-v.b-Math.sqrt(d))/(2*v.a),r2=(-v.b+Math.sqrt(d))/(2*v.a);point(r1,0,'x₁ = '+fmt(r1),2);if(Math.abs(r1-r2)>1e-8)point(r2,0,'x₂ = '+fmt(r2),2)}const [px]=xy(h,0);if(px>=0&&px<=W)seg(px,0,px,H,'#efa74b',1.4,[6,6])}else{point(0,v.c,'(0; '+fmt(v.c)+')')}}labels()}
function setMode(m){mode=m;$('lineTab').classList.toggle('active',m==='line');$('quadTab').classList.toggle('active',m==='quad');controls();render()}
$('lineTab').addEventListener('click',()=>setMode('line'));$('quadTab').addEventListener('click',()=>setMode('quad'));
$('zoomIn').addEventListener('click',()=>{unit=Math.min(220,unit*1.25);render()});$('zoomOut').addEventListener('click',()=>{unit=Math.max(9,unit/1.25);render()});$('recenter').addEventListener('click',()=>{centerX=W/2;centerY=H/2;render()});$('notable').addEventListener('change',render);$('showSaved').addEventListener('change',render);$('remember').addEventListener('click',()=>{stored[mode]={...current[mode]};$('showSaved').checked=true;render()});$('restore').addEventListener('click',()=>{current[mode]={...defaults[mode]};stored[mode]=null;$('showSaved').checked=false;unit=54;centerX=312;centerY=224;controls();render()});
let drag=null;canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY}});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const r=canvas.getBoundingClientRect();centerX+=(e.clientX-drag.x)*W/r.width;centerY+=(e.clientY-drag.y)*H/r.height;drag.x=e.clientX;drag.y=e.clientY;render()});canvas.addEventListener('pointerup',()=>{drag=null});canvas.addEventListener('pointercancel',()=>{drag=null});
controls();render();
})();
</script>
</body>
</html>
